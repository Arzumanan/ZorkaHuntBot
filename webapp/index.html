<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Зорька</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="header">
    <div class="brand">🌄 Зорька</div>
    <select id="place-select" class="hidden" aria-label="Угодье"></select>
  </header>
  <main id="view"><div class="loader">Загрузка…</div></main>
  <nav id="nav" class="nav" aria-label="Разделы">
    <button data-tab="weather" class="active"><span class="ico">🌦</span><span>Прогноз</span></button>
    <button data-tab="seasons"><span class="ico">📅</span><span>Сезоны</span></button>
    <button data-tab="checklist"><span class="ico">🎒</span><span>Чек-лист</span></button>
    <button data-tab="journal"><span class="ico">📖</span><span>Журнал</span></button>
    <button data-tab="more"><span class="ico">⚙️</span><span>Ещё</span></button>
  </nav>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
    // Если статика лежит на другом домене, укажите адрес API, например: window.ZORKA_API_BASE = "https://api.example.com";
    window.ZORKA_API_BASE = window.ZORKA_API_BASE || "";
  </script>
  <script src="/static/core.js"></script>
  <script src="/static/weather.js"></script>
  <script src="/static/seasons.js"></script>
  <script src="/static/checklist.js"></script>
  <script src="/static/journal.js"></script>
  <script src="/static/more.js"></script>
  <script src="/static/consent.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
